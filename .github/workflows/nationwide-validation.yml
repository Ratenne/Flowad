name: Nationwide isolated road validation
on:
  pull_request:
    paths: ['workers/**', 'deploy/osrm/**', 'dist/**', 'scripts/**', '.github/workflows/nationwide-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nationwide-${{ github.ref }}
  cancel-in-progress: true
jobs:
  national-roads:
    # Standard public-repository Linux runners are free. Never consume private-repo paid minutes.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: npm ci && npm run check:ci && node ../scripts/test-dynamic-front.mjs && node ../scripts/test-terrain.mjs
        working-directory: workers
      - run: pip install osmium numpy Pillow && python -m unittest discover -s tests -p test_poi_pipeline.py
      - run: mvn test -q
        working-directory: backend
      - name: Restore isolated national road graph
        uses: actions/cache@v4
        with:
          path: data/raw/korea.osrm*
          key: osrm-mld-v5271-${{ hashFiles('dist/data/poi-manifest.json') }}
      - name: Build an isolated national road graph
        run: |
          mkdir -p data/raw
          image=ghcr.io/project-osrm/osrm-backend:v5.27.1
          if [ ! -f data/raw/korea.osrm.mldgr ]; then
            curl --ipv4 --fail --location --retry 4 --retry-all-errors --connect-timeout 20 https://download.geofabrik.de/asia/south-korea-latest.osm.pbf -o data/raw/korea.osm.pbf
            docker run --rm -v "$PWD/data/raw:/data" "$image" osrm-extract --threads 2 -p /opt/car.lua /data/korea.osm.pbf
            docker run --rm -v "$PWD/data/raw:/data" "$image" osrm-partition --threads 2 /data/korea.osrm
            docker run --rm -v "$PWD/data/raw:/data" "$image" osrm-customize --threads 2 /data/korea.osrm
          fi
          docker run -d --name flowad-road-test -p 127.0.0.1:5000:10000 -v "$PWD/data/raw:/data:ro" -v "$PWD/deploy/osrm/start.sh:/start.sh:ro" "$image" /bin/sh /start.sh
          node workers/scripts/check-national-osrm.mjs http://127.0.0.1:5000
      - name: Load only the public snapshot into local D1
        working-directory: workers
        run: |
          npx wrangler d1 migrations apply flowad --local --config wrangler.local.jsonc
          node scripts/poi-load-public.mjs
      - name: Verify six origins and signed vehicle contracts against isolated real roads
        working-directory: workers
        run: |
          setsid npx wrangler dev --config wrangler.local.jsonc --port 8787 --var ROAD_ROUTING_URL:http://127.0.0.1:5000 > /tmp/flowad-worker.log 2>&1 &
          pid=$!
          trap 'kill -- -"$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node scripts/validate-national-http.mjs http://127.0.0.1:8787
          echo 'National data + isolated OSRM + local Workers/D1 verified. No production or vehicle account calls.' >> "$GITHUB_STEP_SUMMARY"
      - name: Always capture isolated Worker and OSRM diagnostics
        if: always()
        run: |
          if [ -f /tmp/flowad-worker.log ]; then
            echo '::group::Local Worker log'
            cat /tmp/flowad-worker.log
            echo '::endgroup::'
          fi
          if docker inspect flowad-road-test >/dev/null 2>&1; then
            echo '::group::OSRM state, logs and resource usage'
            docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} error={{.State.Error}}' flowad-road-test
            docker logs --timestamps flowad-road-test
            docker stats --no-stream --format 'memory={{.MemUsage}} cpu={{.CPUPerc}} pids={{.PIDs}}' flowad-road-test || true
            echo '::endgroup::'
          fi
      - name: Always remove isolated OSRM
        if: always()
        run: |
          if docker inspect flowad-road-test >/dev/null 2>&1; then docker rm -f flowad-road-test; fi
