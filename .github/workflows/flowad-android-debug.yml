name: Flowad Android debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - codex/stage3-capacitor-starter
    paths:
      - 'mobile/**'
      - '.github/workflows/flowad-android-debug.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
         packages: 'platform-tools'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project and register native bridge
        run: npm run android:init
      - name: Sync Capacitor
        run: npm run android:sync
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flowad-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
